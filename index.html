
<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>ラム酒テイスティング | 銘柄一覧</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- おすすめ検索へのリンク専用スタイル -->
  <style>

    .recommend-entry {
      margin: 16px 0 24px;
    }

    .recommend-entry h2 {
      margin: 0 0 8px;
      color: #173c32;
    }

    .recommend-entry p {
      margin: 8px 0 16px;
    }

    .recommend-entry-link {
      display: block;
      padding: 12px 20px;

      background: #195b47;
      color: #fff;
      border-radius: 8px;

      text-align: center;
      text-decoration: none;
      font-weight: 600;
    }

    .recommend-entry-link:hover {
      background: #173c32;
    }

  </style>

</head>

<body>

  <!-- ヘッダー -->
  <header>
    <a href="index.html">ラム酒テイスティング</a>
  </header>

  <main>

    <h1>銘柄一覧</h1>

    <!-- おすすめ検索への案内 -->
    <section class="panel recommend-entry">

      <h2>好みのラム酒を探す</h2>

      <p>
        好きな香りや風味から、
        あなたの好みに近いラム酒を
        3〜5本おすすめします。
      </p>

      <a
        href="recommend.html"
        class="recommend-entry-link"
      >
        おすすめ検索へ →
      </a>

    </section>

    <!-- 銘柄データの読み込み状況 -->
    <p id="status" aria-live="polite">
      読み込み中…
    </p>

    <!-- 銘柄一覧 -->
    <div id="rum-list" class="grid"></div>

  </main>

  <!-- Supabase接続設定 -->
  <script src="js/config.js"></script>

  <!-- 共通API -->
  <script src="js/api.js"></script>

  <!-- 銘柄一覧の表示処理 -->
  <script src="js/list.js"></script>

</body>

</html>
